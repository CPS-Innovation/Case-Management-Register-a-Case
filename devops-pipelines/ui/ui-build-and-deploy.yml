trigger:
  branches:
    include:
      - main
  paths:
    include:
      - src/ui-spa/*

pr: none

variables:
  - group: cmrc-deployment-global

stages:
  - template: ../templates/ui-build-and-deploy-stages.yml
    parameters:
      environment: "staging"
      deployToSlot: true
      slotName: "stg"

  - stage: Release_Gate
    displayName: "Release Gate"
    jobs:
      # Run playwright E2E tests
      - template: ../templates/e2e-playwright-test-job.yml
        parameters:
          environment: "staging"

      - job: Manual_Validation
        pool: server
        timeoutInMinutes: 6500
        steps:
          - task: ManualValidation@1
            displayName: Request Validation
            timeoutInMinutes: 6480
            inputs:
              notifyUsers: $(prodNotifyUsers)
              approvers: $(prodApprovers)
              allowApproversToApproveTheirOwnRuns: true
              instructions: "Approval is required to deploy to production."
              onTimeout: "reject"

  - template: ../templates/ui-build-and-deploy-stages.yml
    parameters:
      environment: "prod"
      agentPool: "CMRC Prod Pool"
      azureSubscription: "Azure Pipeline: CMRC - Prod"
      deployToSlot: true
      slotName: "stg"
