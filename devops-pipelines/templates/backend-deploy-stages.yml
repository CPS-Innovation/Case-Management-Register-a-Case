parameters:
  - name: environment
    displayName: "Target Environment"
    type: string
    default: "dev"
    values:
      - dev
      - staging
      - prod
  - name: agentPool
    type: string
    default: "CMRC PreProd Pool"
    values:
      - "CMRC PreProd Pool"
      - "CMRC Prod Pool"
  - name: azureSubscription
    type: string
    default: "Azure Pipeline: CMRC - Pre-Prod"
    values:
      - "Azure Pipeline: CMRC - Pre-Prod"
      - "Azure Pipeline: CMRC - Prod"
  - name: deployToSlot
    type: boolean
    default: false
  - name: slotName
    type: string
    default: ""
  - name: dependsOn
    type: string
    default: ""
  - name: buildArtifact
    type: string

stages:
  - stage: Deploy_Backend_${{ parameters.environment }}
    displayName: "${{ parameters.environment }} - Deploy Backend"
    dependsOn: ${{ parameters.dependsOn }}
    variables:
      - template: ./variables/backend-deploy-vars.yml
        parameters:
          environment: ${{ parameters.environment }}
      - template: ./variables/fa-config-${{parameters.environment}}.yml
    pool: ${{ parameters.agentPool }}
    jobs:
      - deployment: Deploy_Backend
        displayName: "${{ parameters.environment }} - Deploy Backend"
        environment: "CMRC-Backend-${{ parameters.environment }}"
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  sparseCheckoutDirectories: devops-pipelines/scripts
                  fetchDepth: 1

                - download: "current"
                  artifact: ${{ parameters.buildArtifact }}

                - task: Bash@3
                  displayName: "Ensure Azure CLI"
                  inputs:
                    targetType: "inline"
                    script: |
                      echo "Checking if Azure CLI is installed..."

                      # Check if az command exists
                      if command -v az &> /dev/null; then
                        echo "Azure CLI is already installed"
                        az --version
                        exit 0
                      fi

                      echo "Azure CLI not found, installing..."
                      bash '$(System.DefaultWorkingDirectory)/devops-pipelines/scripts/installAzureCli.sh'

                - template: ./fa-deploy-steps.yml
                  parameters:
                    environment: ${{ parameters.environment }}
                    azureSubscription: ${{ parameters.azureSubscription }}
                    functionAppName: "fa-cmrc-api-${{ parameters.environment }}"
                    buildArtifact: ${{ parameters.buildArtifact }}
                    deployToSlot: ${{ parameters.deployToSlot }}
                    slotName: ${{ parameters.slotName }}

                - template: ./runner-cleanup-steps.yml
                  parameters:
                    buildArtifact: ${{ parameters.buildArtifact }}
